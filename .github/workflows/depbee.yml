name: depbee scan (제품 연동)

# depbee 제품의 실제 검사다. fixture 시연(fixture-demo.yml, fixture-pr-check.yml)과 별개다.
# depbee Action은 PR의 기준 커밋과 lockfile을 비교하므로 pull_request 이벤트에서만 동작한다.
on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  scan:
    name: depbee scan (제품 실제 검사)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      # 입력은 장면 정책 max-changes 하나다. 모델과 기지 악성 색인은 이 커밋의 depbee 설치본에 든 것을 쓴다.
      - uses: 26-Capstone-Project-Team01/depbee@759cc6880452b178566fe0d3294dadaf1a249d2c
        with:
          max-changes: '1'
